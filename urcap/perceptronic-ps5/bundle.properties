# The OSGi bundle identity of the PolyScope 5 (e-Series) Perceptronic URCap.
# urcap/urcap5.py writes these into META-INF/MANIFEST.MF; Import-Package is derived
# from the compiled classes (jdeps), never hand-listed.
Bundle-SymbolicName=com.nickarmenta.perceptronic
Bundle-Name=Perceptronic
Bundle-Vendor=Nick Armenta
Bundle-Version=0.6.0
Bundle-Activator=com.nickarmenta.perceptronic.Activator
Bundle-Description=Wrist RealSense: the Perceptronic Pick program node (find the part by its size, pick in order from any number of picture points), the Perceptronic installation node (camera, pick areas, reach) and a toolbar button with the live picture
# PolyScope 5's URCap loader requires both flags (BundleInfo / URCapBundleCompatibilityValidatorImpl).
URCapCompatibility-CB3=false
URCapCompatibility-eSeries=true
# The URCap API version PolyScope reads from the embedded META-INF/maven/**/pom.xml
# (PomXMLAPIVersionParser: the com.ur.urcap:api dependency's <version>). PolyScope 5.10+
# refuse a URCap that names a newer API than they carry, so it is the floor's: PolyScope 5.4
# ships the API as polyscope-urcap/api-1.7.0.jar (pom.properties com.ur.urcap:api:1.7.0).
# urcap5.py package checks it against the floor SDK's sdk.json.
urcap.api.version=1.7.0
# The oldest PolyScope 5 this URCap supports (an ursim_e-series image tag): the code is
# compiled against its URCap API, so a call it lacks fails the build, not a pendant.
compat.floor=5.4
# Code that uses newer API than the floor, compiled against that version's jars and only
# ever loaded by name behind a runtime check (paths under src/, comma-separated).
# RobotPositionCallback2 (the TCP offset with a taught position): first in PolyScope 5.8's API.
compat.since.5.8=com/nickarmenta/perceptronic/TeachPosition2.java
# ... and the packages only that code imports, which OSGi must not require.
compat.optional-packages=com.ur.urcap.api.domain.value.robotposition
