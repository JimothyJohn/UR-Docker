name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# A superseded push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: install deps
        run: python -m pip install --require-hashes -r requirements-dev.txt -r requirements-vision.txt
      - name: ruff check
        run: python -m ruff check urctl perceptronics scripts urcap tests
      - name: ruff format
        run: python -m ruff format --check urctl perceptronics scripts urcap tests
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python span on Linux/amd64 (oldest supported, middle, current) …
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        # … plus one modern Python on every other OS/architecture the
        # toolkit claims: Windows, macOS (arm64), Linux (arm64).
        include:
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: ubuntu-24.04-arm, python-version: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: install deps
        # Core is stdlib-only; the extras exercise the optional integrations.
        # opencv/numpy wheels can lag new CPython releases, so extras are
        # best-effort off the oldest/newest edges: fall back to core deps.
        run: python -m pip install --require-hashes -r requirements-dev.txt -r requirements-vision.txt || python -m pip install --require-hashes -r requirements-dev.txt
      - name: unit tests
        run: python -m pytest -m "not integration and not sam" -q
      - name: Windows launchers, run the way a double-click runs them (cmd + Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          rem No robot on a runner, so the doctor's verdict is NOT READY (exit 1): reaching a verdict is the pass.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\cockpit.ps1 -Doctor > doctor.log 2>&1
          type doctor.log
          findstr /c:"verdict:" doctor.log || exit /b 1
          echo N| call Windows-Setup.cmd > setup.log 2>&1
          type setup.log
          findstr /c:"verdict:" setup.log || exit /b 1
          findstr /c:"SETUP FINISHED" setup.log || exit /b 1

  package:
    # The wheel must carry the cockpit's static assets (perceptronics/webui/) and the
    # console scripts — this catches packaging regressions before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: install the build tools (pinned, hashed)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: build sdist + wheel
        # --no-isolation: build with the hatchling pinned above, not whatever PyPI serves today
        run: python -m build --no-isolation
      - name: verify wheel contents
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "perceptronics/webui/index.html",  # the RGB-D cockpit's page
              "perceptronics/realsense.py",
              "urctl/sysinfo.py",
              "urctl/_urp_convert.py",    # build-time copy of scripts/urp_convert.py
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel {wheel} is missing {missing}")
          print(f"{wheel}: all required files present")
          EOF
      - name: smoke-install the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/urctl --help > /dev/null
          /tmp/smoke/bin/perceptronics-gui --help > /dev/null
          /tmp/smoke/bin/perceptronics rs-info > /dev/null 2>&1 || true   # no SDK on the runner: must fail cleanly, not crash
          /tmp/smoke/bin/urctl tools | python3 -c "import json,sys; assert len(json.load(sys.stdin)) >= 20"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # The one required check on `dev` (branch protection + automerge.yml rely on
  # the name): green only when lint, every unit leg and the package job passed.
  # Integration stays out — it only runs on pushes and labelled PRs.
  gate:
    if: always()
    needs: [lint, unit, package]
    runs-on: ubuntu-latest
    steps:
      - name: every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a required job ended $r"; exit 1; }
          done

  integration:
    runs-on: ubuntu-latest
    # The URSim container is large (>1 GB) and slow to start — only run on
    # main and on PRs that carry the run-integration label.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: install deps
        run: python -m pip install --require-hashes -r requirements-dev.txt -r requirements-vision.txt
      - name: start URSim
        run: |
          docker compose up -d
          # Wait for Dashboard + URControl to come up.
          for i in $(seq 1 60); do
            if (echo robotmode; echo quit) | nc -w 2 localhost 29999 2>/dev/null | grep -q 'Robotmode:'; then
              echo "URSim is up"; break
            fi
            sleep 2
          done
      - name: integration tests
        # Tests use sudo docker — GitHub runners don't need it, override.
        env:
          DOCKER: docker
        run: python -m pytest -m integration
      - name: dump polyscope log on failure
        if: failure()
        run: docker exec perceptronics-ursim-1 tail -100 /ursim/polyscope.log || true
      - name: tear down
        if: always()
        run: docker compose down
