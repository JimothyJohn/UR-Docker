name: release-urcap5

# CD for the PolyScope 5 (e-Series) URCap: pushing a `urcap5-v<version>` tag (for
# example urcap5-v0.4.0) publishes the committed urcap/dist/perceptronic-ps5-<version>.urcap
# as a GitHub Release asset with its sha256, for an operator to put on a USB stick.
#
# The jar is not rebuilt here: the URCap API jars it compiles against are UR's and live
# only in the URSim e-Series image (never committed). The build is reproducible and the jar
# carries its sources' digest, so `urcap5.py release-check` proves the committed jar is the
# build of the tagged sources, at the tagged version, and passes PolyScope 5's install
# checks. The Python package's `v*` tags (release.yml) are a separate line.

on:
  push:
    tags: ["urcap5-v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      path: ${{ steps.check.outputs.path }}
      sha256: ${{ steps.check.outputs.sha256 }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: the tag, the version and the committed jar agree
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          out=$(python3 urcap/urcap5.py release-check "$TAG")
          echo "$out"
          python3 -c 'import json, sys; d = json.loads(sys.argv[1]); [print(f"{k}={d[k]}") for k in ("path", "sha256", "version")]' "$out" >> "$GITHUB_OUTPUT"
      - name: the URCap's tests (manifest, install checks, the node's URScript under a JDK)
        run: |
          uv sync --locked
          uv run pytest -q tests/test_urcap5.py

  github-release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous urcap5 tag, for the change list
      - name: notes
        env:
          TAG: ${{ github.ref_name }}
          JAR: ${{ needs.check.outputs.path }}
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: |
          name=$(basename "$JAR")
          echo "$SHA256  $name" > "$JAR.sha256"
          prev=$(git describe --tags --abbrev=0 --match 'urcap5-v*' "$TAG^" 2>/dev/null || true)
          {
            echo "Perceptronic URCap for **PolyScope 5 (e-Series)**: the Perceptronic installation node and the Perceptronic Pick program node."
            echo
            echo "**Install:** copy \`$name\` to a FAT32 USB stick (on a Mac: \`scripts/urcap5-usb.sh\`, which keeps macOS \`._\` files off it), then on the pendant ☰ → Settings → System → URCaps → **+** → the file → Open → **Restart**."
            echo
            echo "**Needs** the RealSense cockpit (\`perceptronics gui\`) or \`perceptronics pick-server\` from this release's commit (\`${GITHUB_SHA::12}\`) or later on the computer the camera is plugged into — the node's requests follow the pick server's protocol at that commit."
            echo
            echo "sha256 \`$SHA256\`"
            echo
            echo "### Changes to the URCap${prev:+ since $prev}"
            git log --format='- %s (%h)' ${prev:+"$prev.."}"$TAG" -- urcap/perceptronic-ps5 perceptronics/picknode.py perceptronics/partspec.py
          } > notes.md
          cat notes.md
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          JAR: ${{ needs.check.outputs.path }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" "$JAR" "$JAR.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Perceptronic for PolyScope 5 — $VERSION" --notes-file notes.md
