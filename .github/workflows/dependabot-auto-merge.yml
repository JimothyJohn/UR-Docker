name: dependabot auto-merge

# Merge the low-risk tail of Dependabot PRs (minor/patch for Python deps and
# actions) automatically once CI is green, so routine maintenance needs no
# human touch. Majors and simulator-image bumps always wait for review.
#
# Requires "Allow auto-merge" to be enabled in the repository settings
# (Settings → General → Pull Requests). Auto-merge respects branch
# protection: the merge only happens after required checks pass.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: enable auto-merge for minor/patch (not simulator images)
        # fetch-metadata reports ecosystems with underscores (docker_compose);
        # guard both spellings so simulator-image bumps never slip through.
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker_compose' &&
          steps.meta.outputs.package-ecosystem != 'docker-compose' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        # When checks are already green, --auto merges immediately — which can
        # race a moving base branch ("Base branch was modified"). Retry a few
        # times before giving up.
        run: |
          for i in 1 2 3 4 5; do
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $i failed — retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::could not enable auto-merge after 5 attempts"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
