name: release

# CD: pushing a version tag (v0.2.0) builds the sdist + wheel and attaches them
# to a GitHub Release. There is no PyPI package (Nick, 2026-09-28): install from
# a checkout or from the release's wheel.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: tag matches package version
        run: |
          pkg=$(uv run python -c "import urctl; print(urctl.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag != urctl.__version__ $pkg — bump urctl/__init__.py"
            exit 1
          fi
      - name: full unit suite
        run: |
          uv sync --locked --extra vision
          uv run pytest -m "not integration" -q
      - name: build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: create GitHub release with artifacts
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
