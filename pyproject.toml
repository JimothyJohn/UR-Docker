[project]
name = "perceptronics"
version = "0.1.0"
description = "perceptronics — vision-guided, agent-driven control for Universal Robots arms (URSim sandbox, RGB-D cockpit, MCP tools)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The core control library (urctl) and the perceptronics core are pure stdlib —
# heavy/optional deps (numpy, OpenCV, torch, the MCP SDK) are imported lazily
# and live under the optional-dependency extras below.
dependencies = []

[project.optional-dependencies]
# Classic-CV perception backend (blob detection) + numpy/OpenCV Frame interop.
vision = ["numpy>=1.24", "opencv-python>=4.8", "pillow>=10.0"]
# Learned monocular depth (Depth Anything V2) backend.
depth = ["torch>=2.0", "transformers>=4.40", "numpy>=1.24", "pillow>=10.0"]
# Segment Anything click-to-segment backend for the RealSense cockpit.
sam = ["torch>=2.0", "transformers>=4.40", "numpy>=1.24", "pillow>=10.0"]

[project.scripts]
urctl = "urctl.cli:main"
urctl-mcp = "urctl.mcp_server:main"
perceptronics = "perceptronics.cli:main"
perceptronics-gui = "perceptronics.webapp:main"
perceptronics-mcp = "perceptronics.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# urp_convert.py lives in scripts/ (single source of truth, predates the
# package); urctl.urp bootstraps it onto sys.path from a source checkout, and
# the wheel ships a build-time copy as urctl/_urp_convert.py so installs work
# without the checkout (the CI package job smoke-tests exactly that).
packages = ["urctl", "perceptronics"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/urp_convert.py" = "urctl/_urp_convert.py"

# Development tools (pytest, hypothesis, ruff, build, hatchling) are not declared here:
# requirements-dev.in lists them, requirements-dev.txt pins them with hashes for every
# supported Python and OS. `python3 -m pip install --require-hashes -r requirements-dev.txt`.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: test requires a running URSim simulator (deselect with -m 'not integration')",
    "realsense: test needs a RealSense camera attached and openable (deselect with -m 'not realsense')",
    "sam: test runs the real SAM checkpoint (needs the `sam` extra + a download; deselect with -m 'not sam')",
    "ufactory_sim: test needs the UFACTORY firmware simulator (UFACTORY_SIM_HOST; deselect with -m 'not ufactory_sim')",
    "state_broadcast: test serves its own fake controller state broadcast (opts out of the unit-test stub)",
]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["programs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
