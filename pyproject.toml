[project]
name = "ur-docker"
version = "0.1.0"
description = "Host-side control + perception tooling for Universal Robots e-Series (URSim sandbox)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The core control library (urctl) and the perception core are pure stdlib —
# heavy/optional deps (numpy, OpenCV, torch, the MCP SDK) are imported lazily
# and live under the optional-dependency extras below.
dependencies = []

[project.optional-dependencies]
# `urctl-mcp` MCP server.
mcp = ["mcp>=1.0"]
# Classic-CV perception backend (blob detection) + numpy/OpenCV Frame interop.
perception = ["numpy>=1.24", "opencv-python>=4.8", "pillow>=10.0"]
# Learned monocular depth (Depth Anything V2) backend.
depth = ["torch>=2.0", "transformers>=4.40", "numpy>=1.24", "pillow>=10.0"]

[project.scripts]
urctl = "urctl.cli:main"
urctl-mcp = "urctl.mcp_server:main"
perception = "perception.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# urp_convert.py lives in scripts/ (single source of truth, predates the
# package); urctl.urp bootstraps it onto sys.path from a source checkout.
packages = ["urctl", "perception"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: test requires a running URSim simulator (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["programs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
