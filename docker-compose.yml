services:
  ursim:
    image: universalrobots/ursim_e-series:5.26.0
    stdin_open: true
    tty: true
    ports:
      - "15900:5900"  # VNC (host 5900 is macOS Screen Sharing on a Mac; noVNC on 6080 is the usual door)
      - "6080:6080"   # noVNC (browser)
      - "29999:29999" # Dashboard server
      - "30000:30000" # Primary client (legacy alias port)
      - "30001:30001" # Primary client (state broadcast + URScript execution)
      - "30002:30002" # Secondary client (read-only mirror)
      - "30003:30003" # RT interface (125/500 Hz state)
      - "30004:30004" # RTDE (modern subscription telemetry — urctl get_state upgrades to this)
      - "30020:30020" # Interpreter mode (URScript REPL inside a loaded program)
      - "502:502"     # Modbus TCP (field I/O)
    environment:
      - ROBOT_MODEL=UR10
    # URSim 5.12.5 was built against an older kernel/glibc; on modern hosts
    # (Linux 6.x) the default Docker seccomp profile causes URControl's
    # socket() calls to return ENOSYS, leaving PolyScope showing
    # "No Controller". Disabling seccomp lets URControl start. NET_BIND_SERVICE
    # lets it bind the Modbus port (502).
    security_opt:
      - seccomp:unconfined
    cap_add:
      - NET_BIND_SERVICE
    # Healthcheck succeeds once URControl has booted and the Dashboard server is
    # replying with a robotmode other than NO_CONTROLLER. Lets dependent services
    # (`depends_on: ursim: condition: service_healthy`) wait on the controller,
    # not just the port being open. Uses python3 (present in the image) — the
    # previous check shelled out to `nc`, which ISN'T installed, so it always
    # failed and the container sat permanently "unhealthy" even though Dashboard
    # was responding. A single probe with generous timeouts so a busy/slow
    # PolyScope front-end under emulation doesn't trip it.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket,sys,time; s=socket.create_connection(('localhost',29999),3); s.sendall(('robotmode'+chr(10)+'quit'+chr(10)).encode()); time.sleep(0.3); d=s.recv(256).decode(); sys.exit(0 if 'Robotmode:' in d and 'NO_CONTROLLER' not in d else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  # PolyScope X simulator (URSim PolyScopeX) — a *separate* product from the
  # e-Series/PolyScope 5 `ursim` above, not a drop-in replacement:
  #   - Web UI on port 80 (no VNC 5900/6080) — mapped to host 8000 so we don't
  #     need a privileged host port and never collide with the e-Series ports.
  #   - Does NOT expose the PolyScope-5 Dashboard (29999) / Primary (30001)
  #     surface, so the `urctl` toolkit in this repo does NOT drive it.
  #   - Needs `--privileged` and a `host.docker.internal` host-gateway alias.
  #   - `ROBOT_TYPE` uses the PolyScope X names: UR3, UR5, UR8L, UR10, UR16,
  #     UR18, UR20, UR30 (distinct from the e-Series `ROBOT_MODEL`).
  # Gated behind the `polyscopex` profile so `docker compose up` still brings up
  # only the e-Series sim. Start it with `docker compose --profile polyscopex up`
  # or `make simx-up`, then open http://localhost:8000 in Chrome.
  ursim-px:
    # Pinned at 10.13.0 on purpose (2026-09-04): in 10.14.0-0.10.777 the
    # Settings -> Security -> Services toggles (Primary Client Interface, RTDE)
    # revert after a few seconds — each flip POSTs firewall rules for the
    # interface "ethCB0", which the sim's firewall service doesn't know
    # ("interface ethCB0 not found in firewall config", 404), so Primary never
    # accepts URScript and urctl can't move the robot. 10.13.0 has no such
    # firewall step and the toggles stick. Both tags ship arm64 images.
    image: universalrobots/ursim_polyscopex:10.13.0
    profiles: ["polyscopex"]
    stdin_open: true
    tty: true
    ports:
      - "8000:80"
      # URScript execution still rides the Primary client (30001); RTDE telemetry
      # is on 30004. Published on OFFSET host ports (31001/31004) so this sim can
      # run alongside the e-Series one without colliding with its 30001/30004.
      # Point the toolkit at them with UR_PRIMARY_PORT=31001 (see `make simx-*`).
      # NOTE: these interfaces must be turned on once in the PolyScope X UI under
      # Settings -> Security -> Services (Primary Client Interface + RTDE), and
      # mutating Robot-API/Primary actions require Remote control mode.
      - "31001:30001"
      - "31004:30004"
    environment:
      # OSX: set HOST_ARCH=arm64 on Apple Silicon (e.g. `HOST_ARCH=arm64 make simx-up`).
      - HOST_ARCH=${HOST_ARCH:-amd64}
      - ROBOT_TYPE=${ROBOT_TYPE:-UR10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # PolyScope X's backend requires full privileges to start.
    privileged: true
    # Persist created applications/programs across container recreation. The
    # e-Series sim has no such mount (its /programs is wiped on recreate); this
    # one does, since PolyScope X is meant for authoring in the web UI.
    volumes:
      - ./.ursim-polyscopex/applications:/ur/bin/backend/applications
    restart: unless-stopped

  # ---- perception service (RealSense capture + RGB-D cockpit) ------------------
  # Built for the Jetson Orin that will sit next to the robot (linux/arm64) and
  # for amd64 dev boxes. `docker compose --profile perception up -d`. Needs USB:
  # privileged + /dev/bus/usb (Docker Desktop on macOS cannot pass USB through —
  # on a Mac run `sudo uv run perception gui` natively instead). No auth: cell
  # network only. Captures persist in ./captures on the host.
  perception:
    profiles: ["perception"]
    build:
      context: .
      dockerfile: Dockerfile.perception
    image: ur-utils/perception:local
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./captures:/captures
    ports:
      - "7621:7621"
    environment:
      - PERCEPTION_SEGMENT_BACKEND=${PERCEPTION_SEGMENT_BACKEND:-stub}
      - PERCEPTION_RS_SERIAL=${PERCEPTION_RS_SERIAL:-}
    restart: unless-stopped
