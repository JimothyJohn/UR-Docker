#!/usr/sbin/nft -f
# perceptronics-cockpit firewall
# Installed as /etc/nftables.conf by deploy/pi/install.sh (the original is kept as
# /etc/nftables.conf.pre-perceptronics); loaded at boot by nftables.service.
# @CELL_NET@ is replaced with the robot/cell subnet: --allow-from, else UR_HOST's /24.
#
# Inbound: loopback, replies to our own connections (RTDE/Primary/Dashboard to the robot),
# ICMP, SSH from anywhere, and the cockpit (:7621) + pick server (:7622) from the cell
# subnet only. Everything else is dropped. Outbound is not filtered.
# Reach the cockpit from a laptop off the cell subnet with an SSH tunnel:
#   ssh -L 7621:127.0.0.1:7621 <user>@<this PC>

define CELL_NET = @CELL_NET@
define COCKPIT_PORTS = { 7621, 7622 }

# Only this table is replaced on reload (no `flush ruleset`), so rules other software
# adds in tables of its own survive a restart of nftables.service.
add table inet perceptronics
delete table inet perceptronics

table inet perceptronics {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state invalid drop
        ct state established,related accept

        # IPv6 needs neighbour discovery to work at all; ping is for diagnosis.
        meta l4proto ipv6-icmp accept
        icmp type { echo-request, destination-unreachable, time-exceeded } accept

        # DHCP replies to this box's own lease requests.
        udp sport 67 udp dport 68 accept

        tcp dport 22 accept
        ip saddr $CELL_NET tcp dport $COCKPIT_PORTS accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
