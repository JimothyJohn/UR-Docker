# perceptronics cell DHCP
# Installed as /etc/perceptronics/cell-dhcp.conf by deploy/pi/install.sh; read by
# perceptronics-cell-dhcp.service (dnsmasq). @CELL_IF@ / @ROBOT_ADDRESS@ / @CELL_MASK@ are
# filled in by the installer (--cell-if, the cell's UR_HOST).
#
# One job: a robot left on DHCP (Settings -> System -> Network -> DHCP, UR's recommended
# choice) on the cell port gets ROBOT_ADDRESS, the UR_HOST the cockpit already talks to.
# One address in the pool, so the robot's address never moves; a second DHCP device on
# the cell port gets nothing (give it a static 192.168.3.x/24 instead). No DNS, no default
# route: the cell stays offline. The service only starts when no other DHCP server
# answered on the port (ExecCondition=, perceptronics.cellnet probe).

port=0
interface=@CELL_IF@
bind-dynamic
except-interface=lo
dhcp-range=@ROBOT_ADDRESS@,@ROBOT_ADDRESS@,@CELL_MASK@,12h
# no router, no DNS server in the offer
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/var/lib/misc/perceptronics-cell.leases
log-dhcp
